<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OderFlow</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #e2e8f0;
    }

    h2 {
      margin: 16px 0 8px;
      font-size: 1rem;
      color: #94a3b8;
      font-weight: 600;
    }

    #status {
      font-size: 0.85rem;
      margin: 12px 0;
      color: #94a3b8;
    }

    .controls {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    button {
      padding: 8px 16px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:last-child {
      background: #475569;
    }

    .stats {
      display: flex;
      flex-direction: row;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .stat {
      flex: 1 1 140px;
      background: #1e293b;
      border-radius: 8px;
      padding: 12px 16px;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .pos {
      color: #22c55e;
    }

    .neg {
      color: #ef4444;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th,
    td {
      text-align: right;
      padding: 8px 12px;
      border-bottom: 1px solid #334155;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="controls">
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
  </div>

  <div id="status">disconnected</div>

  <h2>CURRENT CANDLE</h2>
  <div class="stats">
    <div class="stat">
      <div class="label">Start Time</div>
      <div class="value" id="startTime">--</div>
    </div>
    <div class="stat">
      <div class="label">CVD (BTC)</div>
      <div class="value" id="cvd">--</div>
    </div>
    <div class="stat">
      <div class="label">Trade Count</div>
      <div class="value" id="tradeCount">--</div>
    </div>
    <div class="stat">
      <div class="label">Whale Count</div>
      <div class="value" id="whaleCount">--</div>
    </div>
    <div class="stat">
      <div class="label">VWAP</div>
      <div class="value" id="vwap">--</div>
    </div>
  </div>

  <h2>CLOSED CANDLES</h2>
  <table>
    <thead>
      <tr>
        <th>Start</th>
        <th>CVD</th>
        <th>Trades</th>
        <th>Whales</th>
        <th>VWAP</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch((error) => {
            console.log('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
</body>

</html>
